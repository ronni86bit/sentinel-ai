version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./vectorstore:/app/vectorstore
      - ./main.py:/app/main.py
      - ./ingestion.py:/app/ingestion.py
      - ./chunking.py:/app/chunking.py
      - ./embedding.py:/app/embedding.py
      - ./retrieval.py:/app/retrieval.py
      - ./verification.py:/app/verification.py
      - ./generation.py:/app/generation.py
    # Optional: set restart policy
    restart: unless-stopped